name: DisputeDesk checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet:
    name: .NET and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: DisputeDeskIntegrationOnly
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run .NET tests against PostgreSQL
        env:
          DISPUTEDESK_TEST_POSTGRES: Host=127.0.0.1;Port=${{ job.services.postgres.ports['5432'] }};Database=postgres;Username=postgres;Password=DisputeDeskIntegrationOnly
        run: dotnet test DisputeDesk.slnx --configuration Release --logger "console;verbosity=normal"

  angular:
    name: Angular build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: disputedesk-web
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '^24.15.0'
          cache: npm
          cache-dependency-path: disputedesk-web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --watch=false

  compose:
    name: Docker lifecycle smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build and start DisputeDesk
        run: |
          cp .env.example .env
          docker compose up --build -d
      - name: Verify reviewer lifecycle and customer notifications
        shell: bash
        run: |
          set -a
          source .env
          set +a
          bash .github/scripts/docker-smoke.sh
      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove containers and test data
        if: always()
        run: docker compose down --volumes
